[start]
command:/usr/local/etc/rc.d/flowsight start
parameters:
type:script
message:starting flowsight

[stop]
command:/usr/local/etc/rc.d/flowsight stop
parameters:
type:script
message:stopping flowsight

[restart]
command:/usr/local/etc/rc.d/flowsight restart
parameters:
type:script
message:restarting flowsight

[status]
command:/usr/local/etc/rc.d/flowsight status; exit 0
parameters:
type:script_output
message:request flowsight status

[reload]
command:/usr/local/etc/rc.d/flowsight reload
parameters:
type:script
message:reloading flowsight
