# Flowsight policy. Declare intent once; the compiler renders it to whatever
# each installed backend understands.
version: 1

groups:
  kids:
    description: Kids' devices
    members:
      - 192.168.1.50
      - 192.168.1.51

policies:
  - name: no-adult-content-for-kids
    enabled: true
    comment: Applies only to the kids group, not the whole network.
    match:
      group: kids
    deny:
      domains:
        - example-adult.invalid
        - another-blocked.invalid
