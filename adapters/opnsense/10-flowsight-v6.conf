# IPv6 interception listeners.
#
# Separate from the generated ports because those bind [::1], and pf cannot
# usefully redirect traffic arriving on a LAN interface to an IPv6 loopback
# address - such rules load and match nothing. These bind a unique local
# address the firewall owns on the LAN, which is a normal-scope destination pf
# can redirect to.
#
# A ULA rather than the interface's global address: the delegated prefix has a
# one hour lifetime and changes when the ISP re-delegates, and squid cannot
# rebind to a moving address.
#
# This directory is included by the generated squid.conf and the proxy plugin
# owns only its own files here, so this survives a reconfigure.
http_port [fd97:ba21:29e9::1]:3128 intercept ssl-bump cert=/var/squid/ssl/ca.pem dynamic_cert_mem_cache_size=10MB generate-host-certificates=on
https_port [fd97:ba21:29e9::1]:3129 intercept ssl-bump cert=/var/squid/ssl/ca.pem dynamic_cert_mem_cache_size=10MB generate-host-certificates=on
