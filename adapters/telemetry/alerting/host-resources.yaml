# Resource alerting for the Proxmox host.
#
# These exist because the host went unreachable for a quarter of an hour with
# swap completely full, telemetry ingest silently stopped for days, and nothing
# reported either. Each rule below is one of the failures that actually
# happened, not a guess at what might.
#
# Metrics come from host-sensors.service on pve1, which reads /proc and pushes
# OTLP to the telemetry VIP. Note the metric names: the OTLP-to-Prometheus
# translation appends the unit to the name, so a count declared with unit "1"
# arrives as host_load1_ratio. These names are the ones actually in Mimir.
apiVersion: 1

groups:
  - orgId: 1
    name: host-resources
    folder: Hardware
    interval: 1m
    rules:

      - uid: pve1_swap_filling
        title: pve1 swap more than 70 percent used
        condition: B
        for: 10m
        annotations:
          summary: pve1 is running out of swap
          description: >-
            Swap on {{ $labels.host_name }} is {{ $values.A }} full. When this
            reached 100% the host thrashed hard enough to stop answering ARP
            while still being powered on, taking the firewall VM and every
            container with it.
        labels: {severity: critical}
        noDataState: NoData
        execErrState: Error
        isPaused: false
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: mimir
            model:
              refId: A
              editorMode: code
              expr: host_swap_used_ratio
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0.70]}
                  operator: {type: and}
                  query: {params: [A]}
                  reducer: {type: last, params: []}
              intervalMs: 1000
              maxDataPoints: 43200

      - uid: pve1_memory_high
        title: pve1 memory more than 92 percent used
        condition: B
        for: 10m
        annotations:
          summary: pve1 memory nearly exhausted
          description: >-
            {{ $values.A }} of memory in use on {{ $labels.host_name }}. The
            container limits on this host total more than twice its physical
            memory, so this is the point at which several guests growing at once
            becomes a thrash rather than a busy period.
        labels: {severity: warning}
        noDataState: NoData
        execErrState: Error
        isPaused: false
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: mimir
            model:
              refId: A
              editorMode: code
              expr: host_memory_used_ratio
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0.92]}
                  operator: {type: and}
                  query: {params: [A]}
                  reducer: {type: last, params: []}
              intervalMs: 1000
              maxDataPoints: 43200

      - uid: pve1_disk_saturated
        title: A disk on pve1 has been saturated for an hour
        condition: B
        for: 1h
        annotations:
          summary: "{{ $labels.device }} on pve1 saturated"
          description: >-
            {{ $labels.device }} has been at {{ $values.A }} utilisation for an
            hour. The media drives are USB-attached and run in BOT mode with a
            queue depth of two, so one of them at capacity stalls everything
            sharing it - that is what a load average above 30 on a mostly idle
            CPU is made of.
        labels: {severity: warning}
        noDataState: OK
        execErrState: Error
        isPaused: false
        data:
          - refId: A
            relativeTimeRange: {from: 3600, to: 0}
            datasourceUid: mimir
            model:
              refId: A
              editorMode: code
              expr: host_disk_utilisation_ratio
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0.95]}
                  operator: {type: and}
                  query: {params: [A]}
                  reducer: {type: last, params: []}
              intervalMs: 1000
              maxDataPoints: 43200

      - uid: pve1_io_starvation
        title: pve1 has many processes blocked on IO
        condition: B
        for: 15m
        annotations:
          summary: pve1 processes piling up in uninterruptible sleep
          description: >-
            {{ $values.A }} processes blocked on I/O for 15 minutes. This is the
            symptom that precedes the host becoming unresponsive, and it shows
            up here before the load average means anything to anyone.
        labels: {severity: warning}
        noDataState: NoData
        execErrState: Error
        isPaused: false
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: mimir
            model:
              refId: A
              editorMode: code
              expr: host_procs_blocked
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              conditions:
                - type: query
                  evaluator: {type: gt, params: [25]}
                  operator: {type: and}
                  query: {params: [A]}
                  reducer: {type: last, params: []}
              intervalMs: 1000
              maxDataPoints: 43200

      - uid: telemetry_ingest_stopped
        title: Telemetry ingest has stopped
        condition: B
        for: 10m
        annotations:
          summary: No host metrics received for 10 minutes
          description: >-
            Nothing has arrived from host-sensors on pve1. The sender is fine on
            its own; the usual cause is that nobody holds the telemetry VIP
            192.168.1.251, which happens when both keepalived nodes sit in FAULT
            state and does not clear by itself. Check for the address on
            CT 240 and CT 241, then restart keepalived on the master first.
            This went unnoticed for days once already.
        labels: {severity: critical}
        # NoData is the alerting condition here, not an inconvenience: silence
        # is exactly what a broken ingest path looks like.
        noDataState: Alerting
        execErrState: Error
        isPaused: false
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: mimir
            model:
              refId: A
              editorMode: code
              expr: count(host_sensor_temperature_celsius)
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              conditions:
                - type: query
                  evaluator: {type: lt, params: [1]}
                  operator: {type: and}
                  query: {params: [A]}
                  reducer: {type: last, params: []}
              intervalMs: 1000
              maxDataPoints: 43200

      - uid: pve1_nvme_hot
        title: pve1 NVMe above 75C
        condition: B
        for: 10m
        annotations:
          summary: "{{ $labels.sensor }} above 75C"
          description: >-
            {{ $labels.sensor }} is at {{ $values.A }}C. NVMe drives begin
            throttling in the low 80s, and this one has been observed at 77.8C
            while the host was under sustained I/O load.
        labels: {severity: warning}
        noDataState: NoData
        execErrState: Error
        isPaused: false
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: mimir
            model:
              refId: A
              editorMode: code
              expr: host_sensor_temperature_celsius{type="disk"}
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              conditions:
                - type: query
                  evaluator: {type: gt, params: [75]}
                  operator: {type: and}
                  query: {params: [A]}
                  reducer: {type: last, params: []}
              intervalMs: 1000
              maxDataPoints: 43200
