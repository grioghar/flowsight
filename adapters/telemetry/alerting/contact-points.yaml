# Where alerts go.
#
# The URL is read from ALERT_WEBHOOK_URL in /opt/telemetry/.env rather than
# written here: a Discord webhook URL is a credential - anyone holding it can
# post to that channel - so it belongs with the other secrets in .env and not
# in a file that gets copied around or committed.
#
# Until that variable is set to a real webhook, every rule below still
# evaluates and fires; delivery simply fails and says so in the Grafana log.
# The rules being right is the part that took the work; pointing them at a
# channel is one line.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: ops
    receivers:
      - uid: ops_discord
        type: discord
        settings:
          url: ${ALERT_WEBHOOK_URL}
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: ops
    group_by: [alertname]
    # Grouped and rate-limited deliberately. A host under I/O pressure trips
    # several of these at once, and four separate messages describing one
    # condition is how people learn to ignore alerts.
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
